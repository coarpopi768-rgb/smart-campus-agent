services:
  # ============================================================
  # MySQL 8.0 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: smart-campus-mysql
    restart: unless-stopped
    environment:
      # 从项目根目录 .env 读取（docker compose 自动做变量替换）
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      # 宿主机 3307 → 容器 3306（避开本机已占用的 3306；容器内互联仍走 mysql:3306）
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart-campus-net

  # ============================================================
  # FastAPI 后端
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart-campus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    volumes:
      # 挂载整个项目实现热重载；FAISS 索引直接使用镜像/宿主机中已构建好的
      # rag/vectorstore（不再用空命名卷覆盖，否则索引被隐藏、RAG 失效）
      - .:/app
      - /app/__pycache__
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smart-campus-net

  # ============================================================
  # React + Vite 前端
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smart-campus-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - smart-campus-net

volumes:
  mysql_data:

networks:
  smart-campus-net:
    driver: bridge
